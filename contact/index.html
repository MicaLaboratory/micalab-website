<!DOCTYPE html>
<html lang="en">
<head>

<a class="skip" href="#main">Skip to content</a>

<!-- Tone curve for pale logos: greyscale, darken mid-tones, keep white white -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="ink" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0 0.05 0.1 0.15 0.2 0.25 0.3 0.33 0.36 0.39 0.42 0.45 0.48 0.5 0.52 0.54 0.56 0.58 0.6 1"/>
      <feFuncG type="table" tableValues="0 0.05 0.1 0.15 0.2 0.25 0.3 0.33 0.36 0.39 0.42 0.45 0.48 0.5 0.52 0.54 0.56 0.58 0.6 1"/>
      <feFuncB type="table" tableValues="0 0.05 0.1 0.15 0.2 0.25 0.3 0.33 0.36 0.39 0.42 0.45 0.48 0.5 0.52 0.54 0.56 0.58 0.6 1"/>
    </feComponentTransfer>
  </filter>
</svg>

<main id="main">
  <div class="pagewave"></div>

  <header class="titleband blush">
    <div class="wrap"><h1>Contact</h1></div>
  </header>

  <section class="blush" style="padding-top:24px">
    <div class="wrap grid2" style="align-items:stretch">
      <div class="contact-card">
        <address>mica lab, UWE Bristol<br>Frenchay Campus, Coldharbour Lane<br>Stoke Gifford, Bristol BS16 1QY</address>
        <p class="line"><i class="fa-solid fa-envelope" aria-hidden="true"></i><a href="mailto:tom.mitchell@uwe.ac.uk">tom.mitchell@uwe.ac.uk</a></p>
        <p class="line"><i class="fa-solid fa-location-dot" aria-hidden="true"></i>Bristol, UK</p>
        <div class="btns">
          <a class="btn" href="mailto:tom.mitchell@uwe.ac.uk">Email us</a>
          <a class="btn ghost" href="https://maps.app.goo.gl/T4VXNbrNZiYLm13b9">Open in Google Maps</a>
        </div>
      </div>
      <div class="sketch">
        <img src="/images/bridge.png" alt="Architectural sketch of The Bridge building at UWE Bristol, with an orange facade and the word Bridge beside the entrance">
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2>Supporters and Partners</h2>
      <div class="logos">
        <a href="https://www.uwe.ac.uk/"><img src="/images/partners/uwe.png" alt="UWE Bristol"></a>
        <a href="https://x-io.co.uk/"><img src="/images/partners/xio.png" alt="x-io Technologies"></a>
        <a href="https://www.ukri.org/what-we-do/developing-people-and-skills/future-leaders-fellowships/"><img src="/images/partners/ukri.jpeg" alt="UKRI Future Leaders Fellowships"></a>
        <a href="https://mimugloves.com/"><img src="/images/partners/mimu.png" alt="MiMU"></a>
        <a href="https://www.watershed.co.uk/"><img src="/images/partners/watershed.png" alt="Watershed"></a>
        <a href="https://billyandandy.co.uk/"><img class="pale" src="/images/partners/banda.jpg" alt="Billy and Andy's Music School"></a>
        <a href="https://www.drakemusic.org/"><img src="/images/partners/drake.png" alt="Drake Music"></a>
        <a href="https://www.watershed.co.uk/studio/"><img src="/images/partners/pmstudio.png" alt="Pervasive Media Studio"></a>
        <a href="https://www.ukri.org/councils/ahrc/"><img src="/images/partners/ahrc.png" alt="Arts and Humanities Research Council"></a>
